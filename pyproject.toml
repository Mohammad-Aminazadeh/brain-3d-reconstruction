[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainrec"
version = "0.0.1"
description = "3D reconstruction of brain tissue from serial NDPI histology slices"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scikit-image",
    "opencv-python-headless",
    "openslide-python",
    "openslide-bin",
    "tifffile",
    "SimpleITK",
    "zarr>=3.1",
    "neuroglancer",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
    "instanseg-torch",  # nucleus detector (M7-05, decision after M7-01); brings torch
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "httpx"]
stardist = ["stardist", "tensorflow"]  # second detector candidate (detect_method: stardist)

[project.scripts]
brainrec = "brainrec.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"brainrec.detect" = ["rules_v1.json"]  # reference of the interim classifier (M7-06)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
