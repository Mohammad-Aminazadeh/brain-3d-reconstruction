data_dir: "/Volumes/My Passport/3D FCD Alignment"
work_dir: "/Volumes/My Passport/3D Brain Reconstruction"
z_spacing_um: 5.0   # PLACEHOLDER: real section spacing unknown; only affects Z proportions
base_downsample: 4  # 4 = 0.88 um/px
n_levels: 5
# QC thresholds (M4-05, approved for now; these are the defaults): a pair is flagged when a score is below
# its threshold; null = not checked
qc_min_ncc: 0.40
qc_min_dice: 0.93
# Detection QC (M7-16, approved 2026-11-09; these are the defaults): ratios compare a slice with
# the median of up to two slices on each side, in both directions
qc_cells_density_ratio: 1.33
qc_cells_class_ratio: 1.5
qc_cells_max_blurred_share: 0.5   # of the tiles
qc_fold_od_ratio: 2.0             # x the median tissue optical density
qc_fold_min_area_mm2: 0.05
qc_fold_max_share: 0.01           # of the tissue area
# Local alignment at cell scale (M7-12, approved 2026-11-09; these are the defaults)
align_grid_um: 100.0          # node spacing of the displacement field
align_window_um: 150.0        # radius of the nuclei voting per node
align_search_um: 100.0        # largest local offset searched (coarse stage)
align_min_peak_ratio: 2.0     # a node locks when its peak has 2x the votes of the next peak
